# Request-body capture for the WAF data pipeline (Step 3).
# nginx core cannot log request bodies; OpenResty/lua can. Include this from
# the http{} block of nginx.conf (see docker-compose mounts).
#
# Bodies are read fully (client_body_buffer_size raised), truncated at 8 KiB
# to match scope.toml's body_max_bytes, and exported via the $waf_request_body
# variable used by the waf_json log_format. File uploads stream past the cap
# and are simply truncated in the log — the parser flags truncation downstream.

lua_shared_dict waf_body_store 10m;

init_by_lua_block {
    -- escape for embedding in the JSON log format (control chars + quotes/backslash)
    function waf_json_escape(s)
        if s == nil or s == "" then return "" end
        s = s:gsub('[\\"]', '\\%0'):gsub('\n', '\\n'):gsub('\r', '\\r'):gsub('\t', '\\t')
        s = s:gsub('%c', '')
        return s
    end
}

server {
    # merged into the main server block by the include; see nginx.conf
    client_body_buffer_size 16k;
    client_max_body_size 20m;

    set $waf_request_body "";

    access_by_lua_block {
        ngx.req.read_body()
        local body = ngx.req.get_body_data() or ""
        if #body > 8192 then
            body = body:sub(1, 8192)
        end
        ngx.var.waf_request_body = waf_json_escape(body)
    }
}
