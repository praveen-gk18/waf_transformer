# Full-request logging for the WAF data pipeline (Step 3).
# OpenResty-flavoured nginx config: JSON access log + lua body capture.
# The detection engine must see what the WAF sees: method, target, headers, body.

worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # ---- full-request JSON access log (no bodies; lua adds those) ----
    # Timestamps ISO8601; request line split into method/target/version;
    # headers we care about captured verbatim. Cookie VALUES are logged
    # (the classifier needs session grouping) but the archive is private.
    log_format waf_json escape=json
        '{"ts":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"target":"$request_uri",'
        '"protocol":"$server_protocol",'
        '"host":"$host",'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer",'
        '"cookie":"$http_cookie",'
        '"content_type":"$content_type",'
        '"content_length":$content_length,'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"body":"$waf_request_body"}';

    include includes/waf_request_logging.conf;

    server {
        listen 80;
        server_name _;

        # The app under protection (any upstream; here a stub).
        location / {
            access_log /var/log/nginx/waf_access.json waf_json;
            return 200 "ok\n";
        }
    }
}
