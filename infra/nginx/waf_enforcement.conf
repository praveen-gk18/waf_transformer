# WAF enforcement snippet — "the model decides; the gateway enforces."
#
# Include from your http{} or server{} block (see docs/12_enforcement.md).
# The decision engine (pipeline/gateway.py) answers with:
#   200 allow | 403 block | 429 challenge — plus X-WAF-Score / X-WAF-Action.
#
# curl smoke test:
#   curl -sS -D- --data-binary @sample.raw http://127.0.0.1:8089/waf/decision

upstream waf_decision_engine {
    server 127.0.0.1:8089;
    keepalive 16;
}

# auth_request subrequest: original method/body are forwarded, response
# status is the enforcement verdict.
location = /_waf_decision {
    internal;
    proxy_pass              http://waf_decision_engine/waf/decision;
    proxy_pass_request_body on;
    proxy_set_header        Content-Length $content_length;
    proxy_set_header        X-Request-ID  $request_id;
    # surface score/action in the upstream error log for audit correlation
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
}

# server { ... } in the protected vhost:
#   auth_request     /_waf_decision;
#   auth_request_set $waf_score $upstream_http_x_waf_score;
#   add_header       X-WAF-Score $waf_score always;
#
#   error_page 403 = @waf_block;        # hard block page / JSON
#   error_page 429 = @waf_challenge;    # CAPTCHA or rate-limit redirect
#
#   location @waf_block {
#       return 403 '{"error":"forbidden","waf":"block"}';
#   }
#   location @waf_challenge {
#       # e.g. return 302 /captcha?next=$request_uri;  or limit_req zone
#       return 429 '{"error":"challenge","waf":"captcha"}';
#   }
